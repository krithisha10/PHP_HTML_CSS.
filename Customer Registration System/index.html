<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Registration System</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<div class="header">

<h1>👤 Customer Registration System</h1>

<p>Register Your Details Securely</p>

</div>

<form action="register.php" method="POST">

<label>👤 Full Name</label>
<input type="text" name="name" placeholder="Enter Full Name" required>

<label>📧 Email Address</label>
<input type="email" name="email" placeholder="Enter Email Address" required>

<label>📱 Mobile Number</label>
<input type="tel" name="mobile" pattern="[0-9]{10}" placeholder="Enter 10-digit Mobile Number" required>

<label>🏠 Address</label>
<textarea name="address" rows="4" placeholder="Enter Your Address" required></textarea>

<label>🏙️ City</label>
<input type="text" name="city" placeholder="Enter City" required>

<label>📮 Pincode</label>
<input type="text" name="pincode" pattern="[0-9]{6}" placeholder="Enter 6-digit Pincode" required>

<input type="submit" value="Register">

</form>

</div>

</body>
</html>
