<html>
<head>
    <title>Student Result Processing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Student Result Processing System</h2>

    <form action="result.php" method="POST">

        <label>Student Name</label>
        <input type="text" name="studentName" required>

        <label>Register Number</label>
        <input type="text" name="registerNumber" required>

        <label>HTML Marks</label>
        <input type="number" name="htmlMarks" min="0" max="100" required>

        <label>CSS Marks</label>
        <input type="number" name="cssMarks" min="0" max="100" required>

        <label>PHP Marks</label>
        <input type="number" name="phpMarks" min="0" max="100" required>

        <label>MySQL Marks</label>
        <input type="number" name="mysqlMarks" min="0" max="100" required>

        <label>JavaScript Marks</label>
        <input type="number" name="javascriptMarks" min="0" max="100" required>

        <input type="submit" value="Generate Result">

    </form>

</div>

</body>
</html>
