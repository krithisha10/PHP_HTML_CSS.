<html>
<head>
<title>Sales Calculator</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<div class="header">

<h1>🛒 Sales Calculator</h1>

<p>Calculate Total Sales Value</p>

</div>

<form action="sales.php" method="POST">

<label>Customer Name</label>
<input type="text" name="customer" placeholder="Enter customer name" required>

<label>Product Name</label>
<input type="text" name="product" placeholder="Enter product name" required>

<label>Product Quantity</label>
<input type="number" name="quantity" min="1" placeholder="Enter quantity" required>

<label>Price per Product (₹)</label>
<input type="number" step="0.01" name="price" min="1" placeholder="Enter product price" required>

<input type="submit" value="Calculate Sales">

</form>

</div>

</body>
</html>
