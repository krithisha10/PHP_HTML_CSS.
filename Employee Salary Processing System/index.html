<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Salary Processing System</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<div class="header">

<h1>💼 Employee Salary Processing</h1>

<p>Corporate Payroll Management System</p>

</div>

<form action="salary.php" method="POST">

<label>👤 Employee Name</label>
<input type="text" name="name" placeholder="Enter Employee Name" required>

<label>🆔 Employee ID</label>
<input type="text" name="empid" placeholder="Enter Employee ID" required>

<label>🏢 Department</label>
<select name="department" required>
<option value="">-- Select Department --</option>
<option>Human Resources</option>
<option>Finance</option>
<option>Information Technology</option>
<option>Marketing</option>
<option>Sales</option>
</select>

<label>💰 Basic Salary (₹)</label>
<input type="number" name="basic" placeholder="Enter Basic Salary" required>

<input type="submit" value="Process Salary">

</form>

</div>

</body>
</html>
