<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Performance Evaluation System</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<div class="header">

<h1>📈 Employee Performance Evaluation</h1>

<p>Corporate Performance Assessment Portal</p>

</div>

<form action="evaluation.php" method="POST">

<label>👤 Employee Name</label>
<input type="text" name="name" placeholder="Enter Employee Name" required>

<label>🆔 Employee ID</label>
<input type="text" name="empid" placeholder="Enter Employee ID" required>

<label>🏢 Department</label>
<select name="department" required>

<option value="">-- Select Department --</option>
<option>Human Resources</option>
<option>Finance</option>
<option>Information Technology</option>
<option>Marketing</option>
<option>Sales</option>

</select>

<label>📊 Performance Score (0 - 100)</label>
<input type="number" name="score" min="0" max="100" placeholder="Enter Performance Score" required>

<input type="submit" value="Evaluate Performance">

</form>

</div>

</body>
</html>
