<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Information Portal</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<div class="header">

<h1>👨‍💼 Employee Information Portal</h1>

<p>Corporate Employee Management System</p>

</div>

<form action="employee.php" method="POST">

<label>👤 Employee Name</label>
<input type="text" name="name" placeholder="Enter Employee Name" required>

<label>🆔 Employee ID</label>
<input type="text" name="empid" placeholder="Enter Employee ID" required>

<label>📧 Email Address</label>
<input type="email" name="email" placeholder="Enter Email Address" required>

<label>📱 Mobile Number</label>
<input type="tel" name="mobile" pattern="[0-9]{10}" placeholder="Enter 10-digit Mobile Number" required>

<label>🏢 Department</label>
<select name="department" required>
<option value="">-- Select Department --</option>
<option>Human Resources</option>
<option>Finance</option>
<option>Information Technology</option>
<option>Marketing</option>
<option>Sales</option>
</select>

<label>💼 Designation</label>
<input type="text" name="designation" placeholder="Enter Designation" required>

<input type="submit" value="View Employee Profile">

</form>

</div>

</body>
</html>
