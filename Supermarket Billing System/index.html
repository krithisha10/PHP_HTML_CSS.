<html>
<head>
    <title>Supermarket Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Supermarket Billing System</h2>

    <form action="invoice.php" method="POST">

        <label>Customer Name</label>
        <input type="text" name="customerName" required>

        <label>Product Name</label>
        <input type="text" name="productName" required>

        <label>Quantity</label>
        <input type="number" name="quantity" min="1" required>

        <label>Unit Price (₹)</label>
        <input type="number" name="unitPrice" min="1" step="0.01" required>

        <label>Discount (%)</label>
        <input type="number" name="discount" min="0" max="100" required>

        <label>GST (%)</label>
        <input type="number" name="gst" min="0" max="100" required>

        <input type="submit" value="Generate Invoice">

    </form>

</div>

</body>
</html>
